    <text x="540" y="252" fill="#5ed69a" font-size="34" font-weight="700">92%</text>
    <rect x="515" y="294" width="230" height="86" rx="18" fill="#303038"/>
    <text x="540" y="329" fill="#aaaab2" font-size="20">CALORIES</text>
    <text x="540" y="364" fill="#ffbd63" font-size="34" font-weight="700">346 KCAL</text>
