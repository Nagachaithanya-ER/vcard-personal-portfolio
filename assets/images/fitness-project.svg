<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title description">
  <title id="title">AI virtual fitness trainer</title>
  <desc id="description">A pose-analysis interface with a tracked person and health metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171b"/>
      <stop offset="1" stop-color="#29292f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
  <rect x="55" y="50" width="420" height="350" rx="24" fill="#202027" stroke="#3d3d45" stroke-width="3"/>
  <g fill="none" stroke="#ffbd63" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="265" cy="115" r="38" fill="#2d2d35"/>
    <path d="M265 158v105M265 190l-85 70M265 190l95 58M265 263l-65 100M265 263l82 100"/>
  </g>
  <g fill="#5ed69a">
